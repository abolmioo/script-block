name: Build Script Block
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Unzip and build
        run: |
          for f in *.zip; do [ -f "$f" ] && unzip -o "$f"; done
          DIR=$(dirname "$(find . -name build.gradle -not -path './.git/*' | head -1)")
          cd "$DIR"
          gradle build
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: script-block-jar
          path: out/*.jar
